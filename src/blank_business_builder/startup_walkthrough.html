<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBB Startup Walkthrough</title>
    <style>
        :root {
            --bg: #070b1f;
            --panel: #111a3c;
            --panel-soft: #1a2552;
            --text: #eef2ff;
            --muted: #9fb0e9;
            --accent: #4fffd3;
            --accent-2: #5da8ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top, #19265a 0%, var(--bg) 45%, #030615 100%);
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto auto 1fr;
        }

        .header {
            padding: 18px 22px 8px;
        }

        .title {
            margin: 0;
            font-size: clamp(1.2rem, 2.6vw, 1.9rem);
            letter-spacing: 0.04em;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .controls {
            margin: 0 22px 14px;
            background: rgba(17, 26, 60, 0.88);
            border: 1px solid rgba(159, 176, 233, 0.25);
            border-radius: 14px;
            padding: 12px;
            display: grid;
            gap: 10px;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid rgba(93, 168, 255, 0.35);
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(93, 168, 255, 0.24), rgba(79, 255, 211, 0.2));
            color: var(--text);
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .meta {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .screen-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .screen-pill {
            background: var(--panel-soft);
            border: 1px solid rgba(159, 176, 233, 0.25);
            color: var(--text);
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .screen-pill.active {
            border-color: rgba(79, 255, 211, 0.85);
            color: var(--accent);
        }

        .frame-wrap {
            padding: 0 22px 22px;
            min-height: 0;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 245px);
            border: 1px solid rgba(159, 176, 233, 0.25);
            border-radius: 14px;
            background: #fff;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="title">Better Business Builder · Startup Screen Walkthrough</h1>
        <p class="subtitle">This boot flow walks through every available app screen in sequence.</p>
    </header>

    <section class="controls">
        <div class="row">
            <button id="prevBtn" type="button">← Previous</button>
            <button id="nextBtn" type="button">Next →</button>
            <button id="autoBtn" type="button">Start Auto Play</button>
            <span class="meta" id="progress">Screen 0 of 0</span>
            <span class="meta" id="currentName"></span>
        </div>
        <div class="screen-list" id="screenList"></div>
    </section>

    <section class="frame-wrap">
        <iframe id="screenFrame" title="BBB walkthrough screen"></iframe>
    </section>

    <script>
        const defaultScreens = [
            "business_builder_gui.html",
            "dashboard.html",
            "quantum_features_dashboard.html",
            "sip_phone_dashboard.html"
        ];

        const params = new URLSearchParams(window.location.search);
        const raw = params.get("screens");
        let screens = defaultScreens;

        if (raw) {
            try {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length) {
                    screens = parsed.filter((item) => typeof item === "string" && item.endsWith(".html"));
                }
            } catch (_err) {
                // Fall back to defaults if query payload is malformed.
            }
        }

        if (!screens.length) {
            screens = defaultScreens;
        }

        let index = 0;
        let timer = null;

        const frame = document.getElementById("screenFrame");
        const progress = document.getElementById("progress");
        const currentName = document.getElementById("currentName");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const autoBtn = document.getElementById("autoBtn");
        const screenList = document.getElementById("screenList");

        function renderPills() {
            screenList.innerHTML = "";
            screens.forEach((screen, i) => {
                const pill = document.createElement("button");
                pill.className = "screen-pill";
                pill.type = "button";
                pill.textContent = `${i + 1}. ${screen}`;
                if (i === index) {
                    pill.classList.add("active");
                }
                pill.addEventListener("click", () => {
                    index = i;
                    render();
                });
                screenList.appendChild(pill);
            });
        }

        function render() {
            frame.src = screens[index];
            progress.textContent = `Screen ${index + 1} of ${screens.length}`;
            currentName.textContent = screens[index];
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === screens.length - 1;
            renderPills();
        }

        function stopAuto() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            autoBtn.textContent = "Start Auto Play";
        }

        prevBtn.addEventListener("click", () => {
            if (index > 0) {
                index -= 1;
                render();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (index < screens.length - 1) {
                index += 1;
                render();
            }
        });

        autoBtn.addEventListener("click", () => {
            if (timer) {
                stopAuto();
                return;
            }
            autoBtn.textContent = "Stop Auto Play";
            timer = setInterval(() => {
                if (index >= screens.length - 1) {
                    stopAuto();
                    return;
                }
                index += 1;
                render();
            }, 3500);
        });

        window.addEventListener("beforeunload", stopAuto);
        render();
    </script>
</body>
</html>
